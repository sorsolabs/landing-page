<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorsalabs — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --gray: #6b7280;
      --border: #e5e7eb;
      --accent: #1a56db;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      color: var(--black);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.0625rem;
      color: var(--gray);
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .contact {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .contact:hover { border-color: var(--black); }

    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.8125rem;
      color: var(--gray);
    }
  </style>
</head>
<body>

  <div class="logo">Sorsalabs</div>
  <span class="eyebrow">Coming soon</span>
  <h1>Something new is on the way.</h1>
  <p>We're rebuilding this site. Check back soon, or get in touch in the meantime.</p>
  <a href="mailto:hello@sorsolabs.com" class="contact">hello@sorsolabs.com</a>

  <footer>© 2026 Sorsalabs. All rights reserved.</footer>

</body>
</html>
