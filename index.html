<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 80'%3E%3Cpath d='M6 47 C30 18 62 14 96 40 C124 61 154 62 194 31 C176 58 142 72 104 50 C76 34 44 30 6 47 Z' fill='%230b6bf5'/%3E%3C/svg%3E" />
  <title>Sorsalabs — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --gray: #6b7280;
      --border: #e5e7eb;
      --accent: #1a56db;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      color: var(--black);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .logo svg {
      width: 88px;
      height: auto;
      display: block;
    }

    .logo .wordmark {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.0625rem;
      color: var(--gray);
      max-width: 460px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .contact {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--black);
      text-decoration: none;
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .contact:hover { border-color: var(--black); }

    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.8125rem;
      color: var(--gray);
    }
  </style>
</head>
<body>

  <div class="logo">
    <svg viewBox="0 0 200 80" role="img" aria-label="Sorsalabs">
      <defs>
        <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0b6bf5" />
          <stop offset="100%" stop-color="#2b9bff" />
        </linearGradient>
      </defs>
      <path d="M6 47 C30 18 62 14 96 40 C124 61 154 62 194 31 C176 58 142 72 104 50 C76 34 44 30 6 47 Z" fill="url(#wave)" />
    </svg>
    <span class="wordmark">Sorsalabs</span>
  </div>
  <span class="eyebrow">Coming soon</span>
  <h1>Something new is on the way.</h1>
  <p>We're rebuilding this site. Check back soon, or get in touch in the meantime.</p>
  <a href="mailto:snhean@sorsolabs.com" class="contact">snhean@sorsolabs.com</a>

  <footer>© 2026 Sorsalabs. All rights reserved.</footer>

</body>
</html>
